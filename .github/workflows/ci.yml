name: CI

on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # The mutation check: every solution passes, every buggy version fails. Needs python3,
      # which is preinstalled on the runner.
      - name: Verify challenges
        run: npm run verify

      - name: Build
        run: npm run build
